model_name: 'MultiObsFrontEnv_absolute_agent_DQN_1e5'
train: true
model_class: 'DQN'
env_class: 'MultiObsFrontEnv'

env:
  height: 20
  width: 20
  obstacle_prob: 0.05
  perc_range: 3
  max_steps: 500
  target_discovery_percent: 0.7
  centroids_obs_len: 10
  render_mode: null
  sorting: true
  reverse: False
  obs_spec:
    type: 'absolute'
    ag_pos: True
    i_gain: False
  static_obstacles: true
  static_obstacles_seed: 42
  

model:
  policy: MultiInputPolicy
  device: cpu
  learning_rate: 0.0005
  batch_size: 64
  buffer_size: 50000
  exploration_fraction: 0.2
  exploration_final_eps: 0.05
  target_update_interval: 500
  train_freq: 4

wrapper:
  VecTransposeImage: False
  VecMonitor: True
  VecNormalize:
    norm_obs: True
    norm_reward: true

training:
  total_timesteps: 1000