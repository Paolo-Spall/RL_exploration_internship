model_name: 'MultiobsSimpleAgentExplorationEnv_5x5_1e5'
train: true
model_class: 'DQN'
env_class: 'MultiobsSimpleAgentExplorationEnv'

env:
  height: 5
  width: 5
  obstacle_prob: 0.0
  perception_range: 0
  target_discovery_percent: 0.9
  max_steps: 250
  render_mode: null
  obs_type: 'grid'

wrapper:
  Monitor: true

model:
  policy: MlpPolicy
  device: cpu
  learning_rate: 0.0005
  batch_size: 64
  buffer_size: 50000
  exploration_fraction: 0.9
  exploration_final_eps: 0.05
  target_update_interval: 500
  train_freq: 4


training:
  total_timesteps: 100000