model_name: 'MultiobsSimpleTargetAgentEnv_10x10_PPO_vectorized_3e5'
train: true
model_class: 'PPO'
env_class: 'MultiobsSimpleTargetAgentEnv'

env:
  height: 10
  width: 10
  obstacle_prob: 0.0
  max_steps: 250
  render_mode: null
  obs_type: 'grid'
  
model:
  policy: MlpPolicy
  device: cpu
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

vectorize:
  num_envs: 4

wrapper:
  VecMonitor: true
  DummyVecEnv: true
  VecTransposeImage: false

training:
  total_timesteps: 300000