env:
  centroids_obs_len: 10
  height: 20
  max_steps: 500
  obs_spec:
    ag_pos: false
    i_gain: false
    type: relative
  obstacle_prob: 0.05
  perc_range: 3
  render_mode: null
  reverse: false
  sorting: true
  target_discovery_percent: 0.9
  width: 20
env_class: MultiObsFrontAvoidanceEnv
model:
  batch_size: 64
  buffer_size: 50000
  device: cpu
  exploration_final_eps: 0.05
  exploration_fraction: 0.2
  learning_rate: 0.0005
  policy: MlpPolicy
  target_update_interval: 500
  train_freq: 4
  verbose: 0
model_class: DQN
model_name: MultiObsFrontAvoidanceEnv_relative_DQN_dynamic_1e5_reverse
reverse: true
train: true
training:
  total_timesteps: 100000
wrapper:
  Monitor: true
