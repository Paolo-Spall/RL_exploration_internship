  policy: MultiInputPolicy
  target_update_interval: 500
  train_freq: 4
  verbose: 0
model_class: DQN
model_name: MultiObsFrontAvoidanceEnv_absolute_agent_DQN_dynamic_2e5_frac07_reverse
train: true
training:
  total_timesteps: 200000
wrapper:
  Monitor: true
