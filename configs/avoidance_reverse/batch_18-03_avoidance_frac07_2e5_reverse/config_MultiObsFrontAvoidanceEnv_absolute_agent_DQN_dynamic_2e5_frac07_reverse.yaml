env:
  centroids_obs_len: 10
  height: 20
  max_steps: 500
  obs_spec:
    ag_pos: true
    i_gain: false
    type: absolute
  obstacle_prob: 0.05
  perc_range: 3
  render_mode: null
  reverse: true
  sorting: true
  target_discovery_percent: 0.9
