model_name: 'simple_2D_multiobs_cnn_1e6'
train: true
model_class: 'DQN'
env_class: 'Simple2DGridMultiObs'

env:
  size: 36
  max_steps: 200
  render_mode: null
  policy_type: CnnPolicy

model:
  policy: CnnPolicy
  device: cpu
  learning_rate: 0.0005
  batch_size: 64
  buffer_size: 50000
  exploration_fraction: 0.7
  exploration_final_eps: 0.05
  target_update_interval: 500
  train_freq: 4

wrapper:
  VecTransposeImage: True
  VecNormalize:
    norm_obs: False
    norm_reward: true

training:
  total_timesteps: 1000000