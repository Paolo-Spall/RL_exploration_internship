model_name: 'simple_2D_obs_3e6'
train: true
model_class: 'DQN'
env_class: 'Simple2DGridObs'

env:
  size: 10
  max_steps: 50
  render_mode: null

model:
  policy: MlpPolicy
  device: cpu
  learning_rate: 0.0005
  batch_size: 64
  buffer_size: 50000
  exploration_fraction: 0.7
  exploration_final_eps: 0.05
  target_update_interval: 500
  train_freq: 4

wrapper:
  VecTransposeImage: False
  VecNormalize:
    norm_obs: False
    norm_reward: true

training:
  total_timesteps: 3000000